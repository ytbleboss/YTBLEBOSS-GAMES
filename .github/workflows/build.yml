name: 🎮 YTBLEBOSS GAMES - Build EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 📥 Télécharger le projet
        uses: actions/checkout@v4

      - name: 🟢 Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Installer
        run: npm install

      - name: 🔨 Compiler EXE
        run: npm run build

      - name: 📤 Récupérer EXE
        uses: actions/upload-artifact@v4
        with:
          name: YTBLEBOSS-GAMES-WINDOWS
          path: dist/*.exe
